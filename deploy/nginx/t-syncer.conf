# T-Syncer behind nginx.
#
#   sudo cp deploy/nginx/t-syncer.conf /etc/nginx/sites-available/t-syncer.conf
#   sudo ln -s /etc/nginx/sites-available/t-syncer.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d example.com
#
# Certbot rewrites this file itself: it adds the listen 443 block, the
# certificate paths and the redirect from port 80. Do not write those by hand.

server {
    listen 80;
    listen [::]:80;

    server_name example.com;

    access_log /var/log/nginx/t-syncer.access.log;
    error_log  /var/log/nginx/t-syncer.error.log;

    # The app itself is tiny; this only guards against silly uploads.
    client_max_body_size 2m;

    location / {
        # Must match TSYNCER_PORT in .env. Compose publishes on loopback only,
        # so nginx is the one and only way in.
        proxy_pass http://127.0.0.1:7100;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Pushing a whole month walks every line: GET issue then POST worklog,
        # each up to 30s, plus retries on 429. nginx defaults to 60s and would
        # answer 504 while the push is still running and still writing to Jira.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
