[project]
name = "tsyncer"
version = "1.0.0"
description = "Local-first Jira worklog timesheet"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "peewee==4.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
tsyncer = "api.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["t_syncer/api"]

[tool.pytest.ini_options]
pythonpath = ["t_syncer", "."]
testpaths = ["tests"]
